name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version PR / tags
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm provenance
  actions: read # the docs job below is a reusable workflow

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # 'true' only when `pnpm release` actually published to npm — i.e. this push
      # was the "Version Packages" PR landing, not a regular commit. The docs job
      # keys off it so knitui.dev tracks published versions and nothing else.
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          # No `registry-url`: it writes an .npmrc whose `_authToken` falls back
          # to a placeholder when NODE_AUTH_TOKEN is unset, which would shadow
          # the OIDC trusted-publishing exchange.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm trusted publishing (OIDC, via the `id-token: write` permission
      # above) needs npm >= 11.5.1; Node 24's bundled npm can be older.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # Creates/updates a "Version Packages" PR when changesets are pending,
      # or runs `pnpm release` (build + changeset publish) once that PR is merged.
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
          # Cut a GitHub Release (with the generated changelog) for each
          # published package tag.
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A granular access token with "bypass 2FA" on. A token in the env
          # WINS over the OIDC trusted-publishing exchange, which stays the
          # fallback when the secret is absent. npm ends direct publishing
          # with such tokens around January 2027 — configure a trusted
          # publisher per @knitui/* package before then and drop this line.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # knitui.dev is republished on every version update and only on a version
  # update: this runs when the step above actually published to npm, so the
  # deployed docs are built from the commit that carries the new versions —
  # version numbers, changelog and prop tables all agree with the tarballs.
  docs:
    name: Docs → knitui.dev
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docs.yml
    with:
      environment: production
    secrets: inherit
